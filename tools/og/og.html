<!doctype html>
<!-- OGP 画像（public/og-default.png、1200×630）の元。作品名と金塊の絵（設計書 5.2）。
     作り方は tools/og/README.md -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1f1d1a;
      }
      .wrap {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 88px;
        box-sizing: border-box;
        gap: 72px;
      }
      h1 {
        margin: 0;
        font-size: 104px;
        line-height: 1.1;
        color: #a87b0a;
        white-space: nowrap;
      }
      p {
        margin: 28px 0 0;
        font-size: 36px;
        color: #6b665c;
        line-height: 1.5;
      }
      .art {
        flex: none;
        position: relative;
        width: 300px;
        height: 420px;
      }
      .ground {
        position: absolute;
        left: -20px;
        right: -20px;
        bottom: 0;
        border-top: 2px solid #e6e3da;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>金塊、ちっさ！</h1>
        <p>金を買い続けると、<br />金塊はどのくらいの大きさになる？</p>
      </div>
      <div class="art">
        <!-- 牛乳パックと、1億円の金塊（一辺6.37cm）を同じ縮尺で（1cm＝16px）。絵はゲームと同じ src/ui/art.ts で描く -->
        <canvas id="art" width="300" height="420"></canvas>
        <div class="ground"></div>
      </div>
    </div>
    <script type="module">
      import { drawArt, drawGoldCube, groundShadow } from '../../src/ui/art.ts';

      const S = 16; // 1cm あたりの px
      const DEPTH = 0.35;
      const canvas = document.getElementById('art');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 300 * dpr;
      canvas.height = 420 * dpr;
      canvas.style.width = '300px';
      canvas.style.height = '420px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const ground = 418;
      // 牛乳パック（7×19.5cm）
      const mw = 7 * S;
      const mh = 19.5 * S;
      const mx = 20;
      // 1億円の金塊（5kg、一辺6.37cm）
      const side = Math.cbrt(100_000_000 / 20000 / 19.32) * S;
      const gx = mx + mw + 26;
      groundShadow(ctx, mx + mw / 2, ground, mw);
      groundShadow(ctx, gx + (side * (1 + DEPTH)) / 2, ground, side * (1 + DEPTH));
      drawArt(ctx, 'milk', mx, ground - mh, mw, mh, 3);
      drawGoldCube(ctx, gx, ground, side, DEPTH, 0.6);
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
